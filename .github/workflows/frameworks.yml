name: Update Frameworks

on:
  schedule:
    - cron: "17 21 * * 0"
  workflow_dispatch:

jobs:
  frameworks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate frameworks
        run: node scripts/update-frameworks.mjs
        env:
          PERSONAL_GH_TOKEN: ${{ secrets.PERSONAL_GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          FRAMEWORK_DAYS: 365
          FRAMEWORK_LIMIT: 8
          FRAMEWORK_AUTHORING: Orchardxyz, Orchard, orchardyz@outlook.com, 43738751+Orchardxyz@users.noreply.github.com

      - name: Commit generated frameworks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets
          git commit -m "chore: update frameworks" || exit 0
          git push
