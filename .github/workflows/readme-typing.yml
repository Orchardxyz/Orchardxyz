name: Update README typing

on:
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update typing block
        run: node scripts/update-readme-typing.mjs
        env:
          README_TYPING_TEXT: Make it happen.
          README_TYPING_LIGHT_COLOR: 111827
          README_TYPING_DARK_COLOR: E5E7EB
          README_TYPING_FONT: SF Mono
          README_TYPING_FONT_SIZE: 20
          README_TYPING_WIDTH: 260
          README_TYPING_HEIGHT: 28
          README_TYPING_DURATION: 2500
          README_TYPING_PAUSE: 1000

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/update-readme-typing.mjs .github/workflows/readme-typing.yml
          git commit -m "chore: update readme typing" || exit 0
          git push
